resources:
  jobs:
    spend_categorization_pipeline:
      name: "[${bundle.target}] Spend Categorization Pipeline"

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: llm_endpoint
          default: ${var.llm_endpoint}
        - name: embed_endpoint
          default: "databricks-gte-large-en"
        - name: batch_size
          default: "1000"
        - name: max_batches
          default: "100"
        - name: limit_rows
          default: "0"
        - name: run_catboost
          default: "true"
        - name: min_rows
          default: "50"

      tasks:
        - task_key: define_taxonomies
          notebook_task:
            notebook_path: ../notebooks/0_define_taxonomies.ipynb
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
            source: WORKSPACE
          environment_key: default

        - task_key: ingest
          depends_on:
            - task_key: define_taxonomies
          notebook_task:
            notebook_path: ../notebooks/1_ingest.ipynb
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              llm_endpoint: "{{job.parameters.llm_endpoint}}"
              batch_size: "{{job.parameters.batch_size}}"
              max_batches: "{{job.parameters.max_batches}}"
            source: WORKSPACE
          environment_key: default

        - task_key: embed
          depends_on:
            - task_key: ingest
          notebook_task:
            notebook_path: ../notebooks/2_embed.ipynb
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              embed_endpoint: "{{job.parameters.embed_endpoint}}"
            source: WORKSPACE
          environment_key: default

        - task_key: classify
          depends_on:
            - task_key: embed
          notebook_task:
            notebook_path: ../notebooks/3_classify.ipynb
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              llm_endpoint: "{{job.parameters.llm_endpoint}}"
              embed_endpoint: "{{job.parameters.embed_endpoint}}"
              limit_rows: "{{job.parameters.limit_rows}}"
            source: WORKSPACE
          environment_key: default

        - task_key: train_catboost
          depends_on:
            - task_key: classify
          notebook_task:
            notebook_path: ../notebooks/4_train_catboost.ipynb
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              run_catboost: "{{job.parameters.run_catboost}}"
              min_rows: "{{job.parameters.min_rows}}"
            source: WORKSPACE
          environment_key: default

        - task_key: analytics
          depends_on:
            - task_key: train_catboost
          notebook_task:
            notebook_path: ../notebooks/5_analytics.ipynb
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
            source: WORKSPACE
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - pyyaml
              - openai
              - openpyxl
              - mlflow
              - catboost
              - psycopg2-binary
              - "databricks-sdk>=0.50.0"
